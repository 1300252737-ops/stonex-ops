[project]
name = "stonex-ops"
version = "0.1.0"
description = "StoneX ops MCP server - standalone diagnostics via stonx ctl --output json"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
stonex-ops = "stonex_ops.__main__:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.stonex-ops]
# Minimum compatible stonx version.  doctor checks this at deploy time.
compatible-stonx = ">= 2026-06-16"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
