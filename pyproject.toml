[project]
name = "stonex-ops"
version = "0.1.0"
description = "StoneX ops MCP server - readonly SQL diagnostics plus active probes"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
stonex-ops = "stonex_ops.__main__:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
