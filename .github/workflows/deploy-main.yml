name: Deploy HK Main

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stonex-ops-main-deploy
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv build
      - run: sha256sum dist/*.whl > dist/SHA256SUMS
      - name: Export constraints for deterministic install
        run: uv export --no-hashes --no-emit-project --format requirements-txt > dist/constraints.txt
      - name: Generate RELEASE.json
        run: |
          WHEEL=$(ls dist/stonex_ops-*-py3-none-any.whl | head -1)
          cat > dist/RELEASE.json << EOF
          {
            "source_repo": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "wheel": "$(basename $WHEEL)",
            "checksum": "$(cat dist/SHA256SUMS | cut -d' ' -f1)",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tag": "${{ github.ref_name }}"
          }
          EOF
      - name: Build deploy bundle
        run: |
          WHEEL=$(ls dist/stonex_ops-*-py3-none-any.whl | head -1)
          rm -rf dist/site
          python3 -m pip install \
            --target dist/site \
            --constraint dist/constraints.txt \
            "$WHEEL"
          tar -C dist/site -czf dist/site.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: stonex-ops-wheel-main
          path: |
            dist/stonex_ops-*-py3-none-any.whl
            dist/site.tar.gz
            dist/SHA256SUMS
            dist/RELEASE.json
            dist/constraints.txt
          if-no-files-found: error

  deploy-main:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stonex-ops-wheel-main
          path: dist/

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.STONEX_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STONEX_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"

      - name: Upload deploy bundle
        id: install
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p $RELEASE /stonex/ops/logs /stonex/ops/tmp"

          scp "${SSH_ARGS[@]}" dist/site.tar.gz dist/SHA256SUMS dist/RELEASE.json \
            "${SSH_USER}@${SSH_HOST}:$RELEASE/"

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "RELEASE=$RELEASE bash -s" << 'INSTALL'
          set -e
          rm -rf "$RELEASE/site"
          mkdir -p "$RELEASE/site"
          tar -xzf "$RELEASE/site.tar.gz" -C "$RELEASE/site"
          cat > "$RELEASE/stonex-ops" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          release="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PYTHONPATH="$release/site${PYTHONPATH:+:$PYTHONPATH}"
          exec python3.12 -m stonex_ops "$@"
          WRAPPER
          chmod +x "$RELEASE/stonex-ops"
          INSTALL

      - name: Pre-switch smoke (doctor + MCP list_tools on release bundle)
        id: smoke
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          BIN="$RELEASE/stonex-ops"

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$BIN" doctor \
              --stonx-bin /stonex/bin/stonx \
              --env main \
              --path /stonex \
              --audit-file /stonex/ops/logs/audit.jsonl \
              --json

          scp "${SSH_ARGS[@]}" tests/smoke_mcp.py \
            "${SSH_USER}@${SSH_HOST}:/tmp/smoke_mcp.py"
          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "PYTHONPATH=$RELEASE/site" python3.12 /tmp/smoke_mcp.py "$BIN" /stonex/bin/stonx \
              --env main --path /stonex --audit-file /stonex/ops/logs/audit.jsonl

      - name: Save previous current for rollback
        if: success() && steps.smoke.outcome == 'success'
        id: prev
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          PREV=$(ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "readlink /stonex/ops/current || echo ''")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Switch symlink
        if: success() && steps.smoke.outcome == 'success'
        id: switch
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "RELEASE=$RELEASE bash -s" << 'SWITCH'
          set -e
          ln -sfn "$RELEASE" /stonex/ops/current
          ln -sfn /stonex/ops/current/stonex-ops /stonex/bin/stonex-ops
          echo "Switched to $RELEASE"
          SWITCH

      - name: Post-switch smoke (verify stable entry point)
        if: success() && steps.switch.outcome == 'success'
        id: post-smoke
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            /stonex/bin/stonex-ops --help

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            /stonex/bin/stonex-ops doctor \
              --stonx-bin /stonex/bin/stonx \
              --env main \
              --path /stonex \
              --audit-file /stonex/ops/logs/audit.jsonl \
              --json

      - name: Rollback on switch or post-switch failure
        if: failure() && steps.prev.outputs.prev != '' && (steps.switch.outcome == 'failure' || steps.post-smoke.outcome == 'failure')
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          PREV="${{ steps.prev.outputs.prev }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          echo "Switch or post-switch smoke failed — rolling back to $PREV"
          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "ln -sfn $PREV /stonex/ops/current && \
             ln -sfn /stonex/ops/current/stonex-ops /stonex/bin/stonex-ops && \
             rm -rf /stonex/ops/releases/${{ github.ref_name }}"
          exit 1

      - name: Rollback (remove bad release on pre-switch smoke failure)
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.STONEX_SSH_USER }}
          SSH_PORT: ${{ vars.STONEX_SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -o Port="${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          echo "Smoke failed — removing bad release: $RELEASE"
          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" "rm -rf $RELEASE"
          echo "Rollback complete (previous symlink untouched)"
          exit 1
