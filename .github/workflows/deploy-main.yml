name: Deploy HK Main

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stonex-ops-main-deploy
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv build
      - run: sha256sum dist/*.whl > dist/SHA256SUMS
      - name: Generate RELEASE.json
        run: |
          WHEEL=$(ls dist/stonex_ops-*-py3-none-any.whl | head -1)
          cat > dist/RELEASE.json << EOF
          {
            "source_repo": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "wheel": "$(basename $WHEEL)",
            "checksum": "$(cat dist/SHA256SUMS | cut -d' ' -f1)",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "compatible_stonx": ">= 2026-06-16",
            "tag": "${{ github.ref_name }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: stonex-ops-wheel-main
          path: |
            dist/stonex_ops-*-py3-none-any.whl
            dist/SHA256SUMS
            dist/RELEASE.json
          if-no-files-found: error

  deploy-main:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stonex-ops-wheel-main
          path: dist/

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"

      - name: Upload wheel and install into release venv
        id: install
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          WHEEL=$(ls dist/stonex_ops-*-py3-none-any.whl | head -1)
          WHEEL_NAME="$(basename "$WHEEL")"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -p "${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p $RELEASE /stonex/ops/logs /stonex/ops/tmp"

          scp "${SSH_ARGS[@]}" "$WHEEL" dist/SHA256SUMS dist/RELEASE.json \
            "${SSH_USER}@${SSH_HOST}:$RELEASE/"

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "RELEASE=$RELEASE WHEEL_NAME=$WHEEL_NAME bash -s" << 'INSTALL'
          set -e
          uv venv "$RELEASE/.venv" --python 3.12
          uv pip install --python "$RELEASE/.venv/bin/python" "$RELEASE/$WHEEL_NAME"
          INSTALL

      - name: Smoke test release venv (before symlink switch)
        id: smoke
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -p "${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "$RELEASE/.venv/bin/stonex-ops" doctor \
              --stonx-bin /stonex/bin/stonx \
              --env main \
              --path /stonex \
              --audit-file /stonex/ops/logs/audit.jsonl \
              --json

      - name: Switch symlink (smoke passed)
        if: success() && steps.smoke.outcome == 'success'
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -p "${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "RELEASE=$RELEASE bash -s" << 'SWITCH'
          set -e
          ln -sfn "$RELEASE" /stonex/ops/current
          ln -sfn /stonex/ops/current/.venv/bin/stonex-ops /stonex/bin/stonex-ops
          echo "Deployed: $RELEASE"
          SWITCH

      - name: Rollback (remove bad release on smoke failure)
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SSH_HOST: ${{ vars.MAIN_SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          RELEASE="/stonex/ops/releases/${{ github.ref_name }}"
          SSH_KEY="$RUNNER_TEMP/deploy_key"
          SSH_ARGS=(-i "$SSH_KEY" -p "${SSH_PORT:-22}" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          echo "Smoke failed — removing bad release: $RELEASE"
          ssh "${SSH_ARGS[@]}" "${SSH_USER}@${SSH_HOST}" "rm -rf $RELEASE"
          echo "Rollback complete (previous symlink untouched)"
          exit 1
